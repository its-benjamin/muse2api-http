name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: muse2api-linux-amd64
            data_sep: ":"
          - os: windows-latest
            artifact_name: muse2api-windows-amd64.exe
            data_sep: ";"
          - os: macos-14
            artifact_name: muse2api-darwin-arm64
            data_sep: ":"
          - os: macos-13
            artifact_name: muse2api-darwin-amd64
            data_sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build binary
        run: |
          pyinstaller --name muse2api --onefile --clean --add-data "muse2api/protocol.json${{ matrix.data_sep }}muse2api" --collect-all curl_cffi muse2api/__main__.py
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/muse2api.exe dist/${{ matrix.artifact_name }}
          else
            mv dist/muse2api dist/${{ matrix.artifact_name }}
            chmod +x dist/${{ matrix.artifact_name }}
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
